[project]
name = "recruitment-waala"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.135,<1",
    "psycopg[binary]>=3.3,<4",
    "pypdf>=6,<7",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api", "workers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
